<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kaushal AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
    }

    .header {
      background: #111827;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .chat {
      height: calc(100vh - 130px);
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      line-height: 1.5;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .ai {
      background: white;
      color: #111;
      margin-right: auto;
      box-shadow: 0 1px 5px #ccc;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-left: 8px;
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="header">
    🤖 Kaushal AI
  </div>

  <div class="chat" id="chat">
    <div class="message ai">
      नमस्ते! मैं Kaushal AI हूँ। आप मुझसे कुछ भी पूछ सकते हैं।
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="userInput"
      placeholder="अपना सवाल लिखें..."
      onkeypress="handleKey(event)"
    >

    <button onclick="sendMessage()">
      भेजें
    </button>
  </div>

  <script>
    function sendMessage() {

      const input = document.getElementById("userInput");
      const question = input.value.trim();

      if (question === "") return;

      const chat = document.getElementById("chat");

      // User message
      chat.innerHTML += `
        <div class="message user">
          ${question}
        </div>
      `;

      input.value = "";

      // Temporary AI reply
      setTimeout(() => {

        chat.innerHTML += `
          <div class="message ai">
            आपका सवाल मिला: "${question}"<br><br>
            अभी मेरा AI मॉडल कनेक्ट नहीं है। अगले चरण में असली AI मॉडल जोड़ा जाएगा।
          </div>
        `;

        chat.scrollTop = chat.scrollHeight;

      }, 500);
    }

    function handleKey(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>

</body>
  </html>
